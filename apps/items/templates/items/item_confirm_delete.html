{% extends 'base.html' %}

{% block title %}确认下架 - 游戏道具交易平台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center p-4">
                <i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                <h4 class="mt-3">确认下架道具？</h4>
                <p class="text-muted">
                    您确定要下架道具 <strong>{{ item.name }}</strong> 吗？<br>
                    下架后，该道具将不会出现在市场中。
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-ban"></i> 确认下架
                        </button>
                    </form>
                    <a href="{% url 'items:detail' item.pk %}" class="btn btn-outline-secondary">取消</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
