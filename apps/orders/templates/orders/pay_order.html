{% extends 'base.html' %}

{% block title %}模拟支付{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 640px;">
    <div class="card-body">
        <h2 class="h4 mb-3">模拟支付</h2>
        <p>订单 #{{ order.id }}：{{ order.item.name }}</p>
        <p class="fs-4 fw-bold">应付金额：¥{{ order.price }}</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-primary">确认支付</button>
            <a href="{% url 'orders:detail' order.id %}" class="btn btn-outline-secondary">返回</a>
        </form>
    </div>
</div>
{% endblock %}
