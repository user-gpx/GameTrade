<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-gamepad"></i> 游戏道具交易平台
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/items/">浏览道具</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/items/sell/">我要出售</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                    <li class="nav-item d-flex align-items-center">
                        <span class="nav-link text-warning pe-1" id="balance-display">
                            <i class="fas fa-coins"></i> 余额：¥<span id="balance-amount">{{ user.profile.balance|default:'0.00' }}</span>
                        </span>
                        <button class="btn btn-sm btn-outline-warning me-2" id="recharge-btn" title="充值100元">
                            <i class="fas fa-plus-circle"></i> 充值
                        </button>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> {{ user.username }}
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/users/profile/">个人资料</a></li>
                            <li><a class="dropdown-item" href="/trading/orders/buyer">我购买的</a></li>
                            <li><a class="dropdown-item" href="/trading/orders/seller">我出售的</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/users/logout/">退出</a></li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/users/login/">登录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users/register/">注册</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('recharge-btn');
    if (btn) {
        btn.addEventListener('click', function() {
            if (!confirm('确认充值 ¥100？')) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            fetch('/trading/recharge', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token|default:"" }}',
                },
                body: 'amount=100',
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    document.getElementById('balance-amount').textContent = data.balance;
                    alert('充值成功！当前余额：¥' + data.balance);
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> 充值';
            })
            .catch(function() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> 充值';
            });
        });
    }
});
</script>
